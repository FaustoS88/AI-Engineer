[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AI-engineer"
version = "0.2.0"
description = "AI-powered coding assistant with multi-provider support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.75.0",
    "prompt-toolkit>=3.0.43",
    "pydantic>=2.11.3",
    "python-dotenv>=1.0.1",
    "rich>=14.0.0",
    "flake8>=7.0.0",
    "watchdog>=6.0.0",
    "mcp>=1.6.0",
    "pydantic-ai>=0.1.3",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["AI_engineer*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
